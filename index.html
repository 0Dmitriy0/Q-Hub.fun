<!doctype html>
<html lang="uk" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10141a" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="Q-Hub — усе для Quant RP прямо поверх гри: мапа штату з полями й зонами (і в самій GTA V), ціни скупників від гравців, програма Alt+Q з цінами, правилами сервера й ШІ-помічником." />
    <!-- картка посилання в Discord, Telegram і пошуку: ці месенджери не запускають JavaScript, тож — тут -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Q-Hub" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:title" content="Q-Hub — мапа, ціни скупників і програма для Quant RP" />
    <meta property="og:description" content="Фан-сайт гравців Quant RP: мапа штату з мітками (і в самій GTA V), ціни скупників від гравців, програма поверх гри за Alt+Q." />
    <meta property="og:url" content="https://q-hub.fun/" />
    <meta property="og:image" content="https://q-hub.fun/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Q-Hub — мапа штату Quant RP" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <!-- з'єднання наперед: шрифти й база (ціни, вхід) — мінус ~100 мс до першого запиту -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <!-- шрифти не блокують перший кадр: до їх приходу текст системним шрифтом (display=swap) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" /></noscript>
    <title>Q-Hub</title>
    <script>
      /* тема до першого кадру, без спалаху: явна світла, інакше темна (колишнє 'auto' теж темна).
         Старий ключ qhub-theme зберігав 'auto' всім підряд, тож з нього беремо лише явну світлу */
      (function () {
        var light = false; try { light = localStorage.getItem('qhub-theme2') === 'light' || localStorage.getItem('qhub-theme') === 'light'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f5f8');
      })();
    </script>
    <!-- Umami: відвідування й події (data-umami-event), без cookie; рахує лише q-hub.fun — не локальний сервер і не програму -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="082d4a29-a4a9-4c13-8684-380ca8572f1e" data-domains="q-hub.fun"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
