<!doctype html>
<html lang="uk" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10141a" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="Q-Hub — усе для Quant RP прямо поверх гри: мапа штату з полями й зонами (і в самій GTA V), ціни скупників від гравців, програма Alt+Q з обліком, правилами сервера й помічником." />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" />
    <title>Q-Hub</title>
    <script>
      /* тема до першого кадру, без спалаху: явна світла, інакше темна (колишнє 'auto' теж темна).
         Старий ключ qhub-theme зберігав 'auto' всім підряд, тож з нього беремо лише явну світлу */
      (function () {
        var light = false; try { light = localStorage.getItem('qhub-theme2') === 'light' || localStorage.getItem('qhub-theme') === 'light'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f5f8');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
