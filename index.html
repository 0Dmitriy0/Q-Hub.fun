<!doctype html>
<html lang="uk" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070707" />
    <meta name="google" content="notranslate" />
    <meta name="description" content="Q-Hub — ціни скупників і ринку гравців QuantRP, довідник, облік, склад і гараж персонажа." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Unbounded:wght@500;600;700&display=swap" />
    <title>Q-Hub</title>
    <script>
      /* тема до першого кадру, без спалаху: вибір гравця або тема системи */
      (function () {
        var t = 'auto'; try { t = localStorage.getItem('qhub-theme') || 'auto'; } catch (e) {}
        var dark = t === 'dark' || (t === 'auto' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
