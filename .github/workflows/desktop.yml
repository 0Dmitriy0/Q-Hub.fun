# Збірка Q-Hub Desktop для Windows. Інтерфейс програми й розбір скріншотів збираються з коду сайту (корінь репозиторію),
# тому ставляться залежності й сайту, й програми. На main (і вручну) інсталятор викладається в реліз «desktop-latest»
# (pre-release — тестова версія): кнопка на сторінці «Програма» сайту веде саме туди.
name: Desktop (Windows)

on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'src/**', 'bar.html', 'history.html', 'vite.app.config.ts', 'vite.lib.config.ts', '.github/workflows/desktop.yml']

permissions:
  contents: write   # реліз з інсталятором

# реліз «desktop-latest» один на всіх: дві збірки одночасно перезаписували його навперейми — latest.yml від однієї,
# інсталятор від іншої, і програма відмовлялась оновлюватись («sha512 checksum mismatch»). Тепер збірки йдуть по черзі
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # повна історія: версія = коміти відтоді, як змінили перші дві цифри (scripts/version.mjs)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Номер збірки у версії (програма бачить оновлення лише за більшою версією)
        run: node scripts/version.mjs
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # без сертифіката підпису коду
      # інсталятор з версією в назві (Q-Hub-Setup-0.2.48.exe) — тоді в релізі лишається blockmap попередньої версії,
      # і програма качає лише змінені шматки, а не всі 110 МБ. Копія під сталою назвою — для кнопки на сайті
      - name: Інсталятор під сталою назвою для кнопки на сайті
        shell: bash
        working-directory: desktop/dist
        run: cp Q-Hub-Setup-*.exe Q-Hub-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Q-Hub-Setup
          path: desktop/dist/Q-Hub-Setup.exe
          if-no-files-found: error
      - name: Реліз «desktop-latest» (тестова версія)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Q-Hub Desktop — тестова версія
          prerelease: true
          make_latest: false
          # спершу інсталятор і blockmap (щоб завантажувати лише змінені частини), latest.yml — окремим кроком нижче
          files: |
            desktop/dist/Q-Hub-Setup-*.exe
            desktop/dist/Q-Hub-Setup-*.exe.blockmap
            desktop/dist/Q-Hub-Setup.exe
          body: |
            Тестова версія програми Q-Hub для Windows — ще не фінальна. Можуть траплятися помилки;
            записи, які програма робить сама («Авто ·»), перевіряй у кабінеті.
            Інсталятор не підписаний: Windows покаже «Захистив ваш ПК» → «Докладніше» → «Виконати все одно».
      # latest.yml (версія й контрольна сума) — останнім: програма бачить нову версію лише тоді, коли інсталятор уже на місці
      - name: Реліз «desktop-latest» — опис версії для оновлення
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          prerelease: true
          make_latest: false
          files: desktop/dist/latest.yml
      # старі версії не потрібні: лишаємо 3 останні (з запасом для тих, хто давно не оновлювався — їм просто прийде повне завантаження)
      - name: Прибрати старі версії з релізу
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(gh release view desktop-latest --repo "${{ github.repository }}" --json assets --jq '.assets[].name' \
            | grep -E '^Q-Hub-Setup-[0-9][0-9.]*\.exe$' | sort -V | head -n -3 || true)
          for n in $old; do
            gh release delete-asset desktop-latest "$n" --repo "${{ github.repository }}" -y || true
            gh release delete-asset desktop-latest "$n.blockmap" --repo "${{ github.repository }}" -y || true
          done
