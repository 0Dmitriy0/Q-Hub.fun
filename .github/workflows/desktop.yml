# Збірка Q-Hub Desktop для Windows: інсталятор NSIS як артефакт запуску (Actions → цей запуск → Artifacts).
name: Desktop (Windows)

on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', '.github/workflows/desktop.yml']

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # без сертифіката підпису коду
      - uses: actions/upload-artifact@v4
        with:
          name: Q-Hub-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error
