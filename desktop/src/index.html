<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://cdn.discordapp.com; style-src 'self' 'unsafe-inline'">
<title>Q-Hub</title>
<style>
  :root { --bg: #111214; --card: #1a1b1e; --line: #2a2c30; --fg: #f4f1ec; --muted: #a39e96; --acc: #ff6a1f; --bad: #f87171; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, 'Segoe UI', sans-serif; }
  main { padding: 0 24px 24px; display: grid; gap: 16px; }
  /* вікно без рамки: за верхню смугу його перетягують, справа — кнопки Windows */
  .drag { height: 40px; -webkit-app-region: drag; }
  body { user-select: none; cursor: default; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; }
  .logo i { width: 34px; height: 34px; border-radius: 10px; background: var(--acc); color: #140700; display: grid; place-items: center; font-style: normal; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
  .muted { color: var(--muted); margin: 0; }
  button { font: 700 15px system-ui; border: 0; border-radius: 999px; padding: 11px 18px; min-height: 44px; cursor: pointer; background: #26282c; color: var(--fg); }
  button.acc { background: var(--acc); color: #140700; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  select { font: 15px system-ui; padding: 10px; border-radius: 10px; background: #0e0f11; color: var(--fg); border: 1px solid var(--line); }
  .me { display: flex; gap: 12px; align-items: center; }
  .me img { width: 44px; height: 44px; border-radius: 50%; }
  .err { color: var(--bad); margin: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="drag"></div>
<main>
  <div class="logo"><i>Q</i>Q-Hub</div>
  <section class="card" id="out" hidden>
    <p class="muted">Увійди тим самим Discord, що й на сайті q-hub.fun. Відкриється браузер — підтверди вхід і повертайся сюди.</p>
    <button class="acc" id="login">Увійти через Discord</button>
    <p class="muted" id="wait" hidden>Чекаю підтвердження в браузері…</p>
  </section>
  <section class="card" id="in" hidden>
    <div class="me"><img id="avatar" alt="" hidden><div><b id="name"></b><br><span class="muted" id="game"></span></div></div>
    <label id="pick">Персонаж для обліку<select id="chars"></select></label>
    <p class="muted" id="nochar" hidden>Персонажа ще немає — додай його в кабінеті.</p>
    <div class="row"><button id="cabinet">Відкрити кабінет</button><button id="logout">Вийти</button></div>
    <p class="muted"><b>Alt+Q</b> — швидкий запис в облік поверх гри. Закрите вікно ховається в трей.</p>
  </section>
  <p class="err" id="err" role="alert" hidden></p>
</main>
<script src="renderer.js"></script>
</body>
</html>
