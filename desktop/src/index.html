<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: https://cdn.discordapp.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap">
<title>Q-Hub</title>
<style>
  /* ті самі кольори й шрифти, що в кабінеті (src/styles.css): холодний графіт, помаранчевий акцент, Manrope (Unbounded — лише літери).
     Вікно прозоре: видно лише плашку, довкола неї — поле під тінь */
  :root { --glass: rgba(16, 20, 26, .86); --surface: rgba(26, 35, 48, .72); --surface-hi: rgba(34, 46, 62, .9); --line: rgba(255, 255, 255, .07); --line2: rgba(255, 255, 255, .12);
    --fg: #f4f7fb; --muted: #8b9bb0; --acc: #ff6b00; --acc-hi: #ff7a1a; --discord: #5865f2; --discord-hi: #6873f4; --bad: #ef4444; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { color: var(--fg); font: 15px/1.5 Manrope, system-ui, 'Segoe UI', sans-serif; user-select: none; cursor: default; display: grid; place-items: center; }
  .panel { position: relative; width: 460px; margin: 30px; padding: 28px 26px 22px; border-radius: 22px; background: radial-gradient(120% 60% at 50% 0%, rgba(255, 106, 31, .13), transparent 62%), var(--glass);
    border: 1px solid var(--line); box-shadow: 0 24px 60px -14px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .04);
    -webkit-app-region: drag; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.985); } }
  @media (prefers-reduced-motion: reduce) { .panel { animation: none; } }
  button, select, a, input { -webkit-app-region: no-drag; }
  .x { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: none; border: 0; color: var(--muted); cursor: pointer; }
  .x:hover { background: var(--surface); color: var(--fg); }
  button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); margin: 0; }
  .err { color: var(--bad); margin: 14px 0 0; text-align: center; font-size: 13.5px; }

  /* ---------- вхід ---------- */
  .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
  .mark { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--line2); }
  .mark img { width: 50px; height: 50px; }
  h1 { margin: 0; font: 800 23px Archivo, 'Arial Black', sans-serif; font-stretch: 125%; letter-spacing: -.02em; }
  .hero .muted { max-width: 330px; font-size: 14px; }
  .discord { margin-top: 20px; width: 100%; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 12px; cursor: pointer;
    font: 700 15px Manrope, sans-serif; color: #fff; background: var(--discord); box-shadow: 0 10px 26px -12px rgba(88, 101, 242, .9); }
  .discord:hover { background: var(--discord-hi); }
  .discord:disabled { opacity: .6; cursor: default; }
  .or { display: flex; align-items: center; gap: 12px; margin: 18px 0 14px; color: var(--muted); font-size: 12.5px; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--line2); }
  .steps { display: grid; gap: 10px; font-size: 13.5px; color: var(--muted); }
  .steps div { display: flex; gap: 12px; align-items: flex-start; }
  .steps b { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font: 700 12px Manrope, sans-serif; color: var(--acc); background: rgba(255, 107, 0, .12); }
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }

  /* ---------- вибір персонажа ---------- */
  .me { display: flex; align-items: center; gap: 12px; padding-right: 36px; }
  .me img, .me .ph { width: 42px; height: 42px; border-radius: 13px; object-fit: cover; flex: none; }
  .me .ph { display: grid; place-items: center; background: var(--surface); font: 700 17px Unbounded, sans-serif; color: var(--acc); }
  .me b { display: block; font: 800 16px Manrope, sans-serif; letter-spacing: -.01em; line-height: 1.25; }
  .me span { font-size: 12.5px; }
  .out { margin-left: auto; background: none; border: 0; color: var(--muted); font: 600 12.5px Manrope, sans-serif; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .out:hover { color: var(--fg); background: var(--surface); }
  h2 { margin: 20px 0 12px; font: 700 13px Manrope, sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 18px; border: 1px solid var(--line2); background: var(--surface); color: var(--fg); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; transition: transform .15s, border-color .15s, background .15s; }
  .tile:hover { transform: translateY(-2px); border-color: rgba(255, 107, 0, .55); background: var(--surface-hi); }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover { transform: none; } }
  .tile .ava { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font: 700 22px Unbounded, sans-serif; color: #160800;
    background: linear-gradient(150deg, #ff7a2e, #d9480f); box-shadow: 0 10px 22px -10px rgba(255, 106, 31, .8); }
  .tile .nm { max-width: 100%; font: 700 13.5px Manrope, sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile.last { border-color: rgba(255, 107, 0, .7); box-shadow: 0 0 0 1px rgba(255, 107, 0, .35) inset; }
  .tile .tag { position: absolute; top: 8px; right: 8px; font: 700 10px Manrope, sans-serif; color: var(--acc); background: rgba(255, 107, 0, .14); padding: 2px 7px; border-radius: 999px; }
  .tile.add { border-style: dashed; background: transparent; color: var(--muted); }
  .tile.add .ava { background: var(--surface); color: var(--muted); box-shadow: none; font: 600 28px Manrope, sans-serif; }
  .tile.add:hover { color: var(--fg); }
  .addf { display: grid; gap: 10px; margin-top: 14px; padding: 14px; border-radius: 16px; border: 1px solid var(--line2); background: var(--surface); }
  .addf label { display: grid; gap: 5px; font: 600 12.5px Manrope, sans-serif; color: var(--muted); }
  .addf input { font: 600 14.5px Manrope, sans-serif; color: var(--fg); background: rgba(10, 14, 20, .7); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 11px; outline: 0; user-select: text; }
  .addf input:focus { border-color: rgba(255, 107, 0, .6); }
  .addf button { font: 700 14px Manrope, sans-serif; color: #fff; background: var(--acc); border: 0; border-radius: 12px; padding: 11px; cursor: pointer; }
  .addf button:hover { background: var(--acc-hi); }
  .addf button:disabled { opacity: .6; cursor: progress; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <button class="x" id="close" title="Сховати в трей" aria-label="Сховати в трей"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>

  <section id="out" hidden>
    <div class="hero">
      <div class="mark"><img src="ui/brand/q-hub-logo.svg" alt=""></div>
      <h1>Q-Hub</h1>
      <p class="muted">Облік, склад і ціни для QuantRP — прямо поверх гри.</p>
    </div>
    <button class="discord" id="login">
      <svg width="22" height="17" viewBox="0 0 127 96" aria-hidden="true"><path fill="currentColor" d="M107.7 8.1A105 105 0 0 0 81.5 0a72 72 0 0 0-3.4 6.8 97.7 97.7 0 0 0-29.1 0A72 72 0 0 0 45.6 0a105.9 105.9 0 0 0-26.2 8.1C2.8 32.6-1.7 56.6.5 80.2a105.7 105.7 0 0 0 32.2 16.2 77.7 77.7 0 0 0 6.9-11.1 68.4 68.4 0 0 1-10.8-5.2c.9-.7 1.8-1.4 2.7-2.1a75.6 75.6 0 0 0 64.3 0c.9.7 1.8 1.4 2.7 2.1a68.7 68.7 0 0 1-10.9 5.2 77 77 0 0 0 6.9 11.1 105.3 105.3 0 0 0 32.2-16.2c2.6-27.4-4.6-51.2-19.1-72.1ZM42.5 65.7c-6.3 0-11.4-5.7-11.4-12.8s5-12.8 11.4-12.8 11.5 5.8 11.4 12.8c0 7-5 12.8-11.4 12.8Zm42.2 0c-6.3 0-11.4-5.7-11.4-12.8s5-12.8 11.4-12.8 11.5 5.8 11.4 12.8c0 7-5 12.8-11.4 12.8Z"/></svg>
      <span id="loginText">Увійти через Discord</span>
    </button>
    <div class="or">як це працює</div>
    <div class="steps">
      <div><b>1</b>Відкриється браузер — увійди тим самим Discord, що й на q-hub.fun.</div>
      <div><b>2</b>Підтверди вхід і повертайся сюди: програма підхопить його сама.</div>
    </div>
  </section>

  <section id="in" hidden>
    <div class="me">
      <img id="avatar" alt="" hidden><div class="ph" id="ph" hidden></div>
      <div><b id="name"></b><span class="muted" id="game"></span></div>
      <button class="out" id="logout">Вийти</button>
    </div>
    <h2>Обери персонажа</h2>
    <div class="tiles" id="tiles"></div>
    <p class="muted" id="nochar" hidden style="margin-top:12px;font-size:13px">Персонажа ще немає — додай його тут: у кожного свій облік, склад і гараж.</p>
    <form class="addf" id="addf" hidden>
      <label>Ім'я_Прізвище, як у грі<input id="cname" maxlength="31" placeholder="Dmitriy_Core" autocomplete="off" spellcheck="false" required pattern="[A-Z][a-zA-Z]{1,14}_[A-Z][a-zA-Z]{1,14}" title="Латиницею через «_», з великих літер: Dmitriy_Core"></label>
      <label>Статік<input id="cstatic" inputmode="numeric" maxlength="9" placeholder="162183" autocomplete="off" required pattern="d{1,9}" title="Число з гри"></label>
      <label>Баланс у грі зараз, $<input id="cstart" inputmode="numeric" placeholder="6 900 661" autocomplete="off"></label>
      <button id="cadd">Додати персонажа</button>
    </form>
  </section>

  <p class="err" id="err" role="alert" hidden></p>
</div>
<script src="renderer.js"></script>
</body>
</html>
